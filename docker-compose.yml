services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-interno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_interno
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sistema-interno-postgres-data:/var/lib/postgresql/data

volumes:
  sistema-interno-postgres-data:
